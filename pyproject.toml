[project]
name = "epgnn"
version = "0.0.1"
description = "Spatio-temporal GNN for European day-ahead electricity prices (CS224W)"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "pyarrow",
  "google-cloud-storage",
]

# Model stack: same core as the course Colabs (torch + PyTorch Geometric), without their course-only
# extras (deepsnap, ogb, torch_scatter/torch_sparse), plus XGBoost for the non-graph baselines.
[project.optional-dependencies]
inspection = [
  "nbformat",
  "nbclient",
  "ipykernel",
  "matplotlib",
]
model = [
  "torch>=2.7",
  "torch_geometric>=2.6",
  "xgboost",
  "scikit-learn",
  "networkx",
  "matplotlib",
  "pyyaml",
]

[tool.mypy]
python_version = "3.12"
files = ["epgnn", "scripts"]

# google-cloud-storage ships neither stubs nor a py.typed marker.
[[tool.mypy.overrides]]
module = "google.cloud.*"
ignore_missing_imports = true

# pandas / pyarrow / numpy stubs are not installed in the dev environment.
[[tool.mypy.overrides]]
module = ["pandas.*", "pyarrow.*", "numpy.*"]
ignore_missing_imports = true

# epgnn isntall
[tool.setuptools.packages.find]
include = ["epgnn", "epgnn.*"]

