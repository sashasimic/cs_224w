# Checkpoint 3: GRU + 2 pre-norm GATv2 blocks on the interconnector graph. Same encoder, target and loss as
# checkpoint 2.5; c3_nograph is this network with the messages switched off, so (3 - c3_nograph) isolates
# the zone-to-zone messages and (c3_nograph - 2.5) the extra depth.
model: gat
feature_set: own
graph: interconnects
history_window: 168
hidden: 64
mlp_hidden: 128
heads: 4
layers: 2
dropout: 0.1
fit_splits: [pretrain, train]
eval_splits: [val, test]
epochs: 50
lr: 0.001
patience: 8
batch_days: 16
spread_weight: 0.5
seed: 0
device: cpu          # sparse graph ops are faster on CPU than on MPS for this size
