# Control for c3_gat_hourmix: identical layers and weights, but every zone attends only to itself (no links).
# (c3_gat_hourmix - this) is the value of the connections alone.
model: gat
feature_set: own
graph: self
history_window: 168
hidden: 64
mlp_hidden: 128
heads: 4
layers: 2
hour_mixer: bigru
dropout: 0.1
fit_splits: [pretrain, train]
eval_splits: [val, test]
epochs: 50
lr: 0.001
patience: 8
batch_days: 16
spread_weight: 0.5
seed: 0
device: cpu          # sparse graph ops are faster on CPU than on MPS for this size
