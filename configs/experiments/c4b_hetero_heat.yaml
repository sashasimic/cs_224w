# Checkpoint 4b + heat: best model plus heat-stress features (H3).
model: hetero
feature_set: own+heat
graph: interconnects
history_window: 168
hidden: 64
constraint_hidden: 32
layers: 2
heads: 4
ptdf_min: 0.005
pretrain: {splits: [pretrain]}       # zone-only network, no constraint nodes exist before 2022-06-09
fit_splits: [train]
eval_splits: [val, test]
epochs: 50
lr: 0.001
patience: 8
spread_weight: 0.5
seed: 0
