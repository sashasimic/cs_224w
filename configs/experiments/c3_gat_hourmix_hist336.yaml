# Checkpoint 3 + cross-hour layer + 14-day history: c3_gat_hourmix with history_window 336 (was 168).
# (this - c3_gat_hourmix) is the value of the longer history on top of the cross-hour layer.
model: gat
feature_set: own
graph: interconnects
history_window: 336
hidden: 64
mlp_hidden: 128
heads: 4
layers: 2
hour_mixer: bigru
dropout: 0.1
fit_splits: [pretrain, train]
eval_splits: [val, test]
epochs: 50
lr: 0.001
patience: 8
batch_days: 16
spread_weight: 0.5
seed: 0
device: cpu          # sparse graph ops are faster on CPU than on MPS for this size
