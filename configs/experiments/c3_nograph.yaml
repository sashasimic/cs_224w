# Checkpoint 3 control: the checkpoint-3 network (GRU, input layer, 2 pre-norm blocks, head) with no messages:
# each block is LayerNorm + feed-forward only. Same depth and widths as c3 (only the GATv2 weights are absent),
# so (3 - this) is the graph alone.
model: gat
feature_set: own
graph: none
history_window: 168
hidden: 64
mlp_hidden: 128
heads: 4
layers: 2
dropout: 0.1
fit_splits: [pretrain, train]
eval_splits: [val, test]
epochs: 50
lr: 0.001
patience: 8
batch_days: 16
spread_weight: 0.5
seed: 0
device: cpu          # sparse graph ops are faster on CPU than on MPS for this size
