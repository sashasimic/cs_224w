# Checkpoint 4b control: identical to c4b_hetero_constraints, but each constraint's edges point at a random
# permutation of the zones in that hour's domain. The constraint data stays; only the zone attribution
# (which zone loads which line) is destroyed. (4b - control) is the value of the PTDF wiring.
model: hetero
feature_set: own
graph: interconnects
constraints: shuffled
constraint_lag_hours: 0
max_constraints: 64
history_window: 168
hidden: 64
c_hidden: 32
mlp_hidden: 128
heads: 4
layers: 2
dropout: 0.1
fit_splits: [pretrain, train]
eval_splits: [val, test]
epochs: 50
lr: 0.001
patience: 8
batch_days: 16
spread_weight: 0.5
seed: 0
device: cpu
