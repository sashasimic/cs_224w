# Checkpoint 3 + cross-hour layer: identical to c3_gat_interconnects plus a bidirectional GRU over each zone's
# 25 delivery hours, reading the week summary and only columns known at the cutoff (features.KNOWN_AT_CUTOFF).
# (this - c3) is the value of letting the hours of day D see each other.
model: gat
feature_set: own
graph: interconnects
history_window: 168
hidden: 64
mlp_hidden: 128
heads: 4
layers: 2
hour_mixer: bigru
dropout: 0.1
fit_splits: [pretrain, train]
eval_splits: [val, test]
epochs: 50
lr: 0.001
patience: 8
batch_days: 16
spread_weight: 0.5
seed: 0
device: cpu          # sparse graph ops are faster on CPU than on MPS for this size
