# Checkpoint 3 control: the same model on a shuffled zone graph (random rewiring, out-degrees kept).
model: gat
feature_set: own
graph: shuffled
history_window: 168
hidden: 64
mlp_hidden: 128
heads: 4
layers: 2
dropout: 0.1
fit_splits: [pretrain, train]
eval_splits: [val, test]
epochs: 50
lr: 0.001
patience: 8
batch_days: 16
spread_weight: 0.5
seed: 0
device: cpu
