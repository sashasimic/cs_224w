# Checkpoint 4a: checkpoint 3 plus per-zone JAO constraint summaries as node features.
model: gat
feature_set: own+jao
graph: interconnects
history_window: 168
hidden: 64
layers: 2
heads: 4
pretrain: {splits: [pretrain]}
fit_splits: [train]
eval_splits: [val, test]
epochs: 50
lr: 0.001
patience: 8
spread_weight: 0.5
seed: 0
