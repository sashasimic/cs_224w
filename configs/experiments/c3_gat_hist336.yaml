# Checkpoint 3 with a 14-day history: identical to c3_gat_interconnects except history_window 336 (was 168).
# The window still ends at the cutoff (D-1 10:00 UTC); it only reaches a week further back.
model: gat
feature_set: own
graph: interconnects
history_window: 336
hidden: 64
mlp_hidden: 128
heads: 4
layers: 2
dropout: 0.1
fit_splits: [pretrain, train]
eval_splits: [val, test]
epochs: 50
lr: 0.001
patience: 8
batch_days: 16
spread_weight: 0.5
seed: 0
device: cpu          # sparse graph ops are faster on CPU than on MPS for this size
