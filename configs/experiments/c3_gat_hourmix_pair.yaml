# c3_gat_hourmix with pairwise messages in place of GATv2: for each link a small network reads both zones and
# the link's lagged flows and writes a message for that pair; a zone sums the messages of its links.
model: gat
feature_set: own
graph: interconnects
history_window: 168
hidden: 64
mlp_hidden: 128
heads: 4
layers: 2
hour_mixer: bigru
edge_feats: flows
message: pair
dropout: 0.1
fit_splits: [pretrain, train]
eval_splits: [val, test]
epochs: 50
lr: 0.001
patience: 8
batch_days: 16
spread_weight: 0.5
seed: 0
device: cpu          # sparse graph ops are faster on CPU than on MPS for this size
