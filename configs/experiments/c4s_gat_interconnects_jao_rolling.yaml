# H2, zone level: c3s_gat_interconnects_curves_rolling + the six jao_*_lag24 features (D-1 domain, same UTC hour).
# Control: c3s_gat_interconnects_curves_rolling (seeds 0-2).
model: gat_scope
graph: interconnects
positional: true
history: base
day_inputs: own_cyclic_asof_jao
price_curves: true
strict_inputs: true
history_window: 168
hidden: 64
heads: 4
layers: 2
ffn: 128
mlp_hidden: 128
dropout: 0.1
fit_splits: [pretrain, train]
eval_splits: [val, test]
epochs: 50
lr: 0.001
patience: 8
batch_days: 16
spread_weight: 0.5
seed: 0
rolling:
  window_days: 730
  epochs: 2
  lr: 0.0001
  start: continue
